# Netlify Configuration for Knotique Business Portal

[build]
  # Build settings: tells Netlify to build the client app
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Reverse-proxy /api/* directly through Netlify to the backend API.
# This eliminates CORS preflight issues, avoids hardcoding URLs in the JS bundle,
# and guarantees /api/* requests cannot accidentally fall through to index.html.
[[redirects]]
  from = "/api/*"
  to = "https://knotique-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

